name: "GO APP CI"
on:
  push:
    branches:
      - testing
jobs:
  "build":
    runs-on: ubuntu-22.04
    steps:
      - name: "Checkout app"
        uses: actions/checkout@v4
      - name: "Set up"
        uses: "actions/setup-go@v5"
        with:
          go-version: 1.23
          cache-depenency-path: go.sum
      - name: Build
        run: go build -o ./bin/ -v ./...

      - name: Run unit tests
        run: go test -run 'Unit' -v ./...
  "linter":
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.63
